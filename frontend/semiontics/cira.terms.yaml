  internal: DemoStep
  en: Three states of one synthetic system, and a barrier between them
  de: Drei Zustände eines synthetischen Systems und eine Barriere dazwischen
  meaning: narration
- key: demo.2
  internal: DemoStep
  en: The reference changes; the observation window sees it
  de: Der Referenzzustand ändert sich; das Beobachtungsfenster sieht es
  meaning: narration
- key: demo.3
  internal: DemoStep
  en: What the observation cannot see stays honestly open
  de: Was die Beobachtung nicht sieht, bleibt ehrlich offen
  meaning: narration
- key: demo.4
  internal: DemoStep
  en: The engine fills gaps from observations alone, and we see where it differs
  de: Die Engine füllt Lücken nur aus Beobachtungen, und wir sehen, wo sie abweicht
  meaning: narration
- key: demo.5
  internal: DemoStep
  en: Two independent reconstruction paths, each with its own trace
  de: Zwei unabhängige Rekonstruktionswege mit je eigenem Verlauf
  meaning: narration
- key: demo.6
  internal: DemoStep
  en: Exact fractions, no overall score
  de: Exakte Brüche, kein Gesamtwert
  meaning: narration
- key: demo.7
  internal: DemoStep
  en: A recovery variant, approved by a human, measured against the baseline
  de: Eine von einem Menschen freigegebene Wiederherstellungsvariante, gemessen am Ausgangsszenario
  meaning: narration
- key: demo.8
  internal: DemoStep
  en: Everything is exportable and reproducible
  de: Alles ist exportierbar und reproduzierbar
  meaning: narration
- key: demo.v1
  internal: deep path
  en: How do you know the engine is blind?
  de: Woher weiß man, dass die Engine blind ist?
  meaning: deep-dive path
- key: demo.v2
  internal: deep path
  en: Are these real results?
  de: Sind das echte Ergebnisse?
  meaning: deep-dive path
- key: demo.v3
  internal: deep path
  en: How exact is the evaluation?
  de: Wie exakt ist die Auswertung?
  meaning: deep-dive path
- key: demo.v4
  internal: deep path
  en: What happens with recovery proposals?
  de: Was passiert mit Wiederherstellungsvorschlägen?
  meaning: deep-dive path
- key: demo.v5
  internal: deep path
  en: Where are the gaps?
  de: Wo sind die Lücken?
  meaning: deep-dive path
