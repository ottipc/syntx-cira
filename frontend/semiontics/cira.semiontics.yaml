sems:
- id: SEM-001
  name: Space anchor reference
  channels:
    shape: rect sharp
    color: space.actual
    glyph: null
    pattern: null
  binds:
  - enum: StateSpace
    values:
    - A
  - enum: Applicability
    values:
    - APPLICABLE
  views:
  - 1
  - 2
  - 3
  - 9
  - 10
  primitive: SpaceHeader
  term: space.a
  exclusion: never for observed or reconstructed values
- id: SEM-002
  name: Space anchor observed
  channels:
    shape: rect chamfer
    color: space.observed
    glyph: null
    pattern: null
  binds:
  - enum: StateSpace
    values:
    - O
  views:
  - 1
  - 2
  - 3
  - 4
  - 9
  primitive: SpaceHeader
  term: space.o
  exclusion: never for Ω_A or system errors
- id: SEM-003
  name: Space anchor reconstructed
  channels:
    shape: octagon double
    color: space.reconstructed
    glyph: null
    pattern: null
  binds:
  - enum: StateSpace
    values:
    - R
  - enum: ReconstructionStatus
    values:
    - DETERMINED
  views:
  - 1
  - 2
  - 3
  - 5
  - 6
  - 7
  - 8
  - 9
  primitive: SpaceHeader
  term: space.r
  exclusion: never as secured ground truth
- id: SEM-004
  name: Observed value
  channels:
    shape: dot filled
    color: space.observed
    glyph: ●
    pattern: null
  binds:
  - enum: ObservationStatus
    values:
    - KNOWN
  views:
  - 2
  - 3
  - 4
  primitive: SpaceCell
  term: obs.known
  exclusion: never without source_id
- id: SEM-005
  name: Observed delayed
  channels:
    shape: dot half
    color: space.observed
    glyph: ◐
    pattern: lag-tag
  binds:
  - flag: ProjectedValue.stale
  views:
  - 3
  - 4
  - 9
  primitive: SpaceCell
  term: obs.known.stale
  exclusion: never as UNKNOWN or FALSE
- id: SEM-006
