    shape: frame dashed
    color: open.epistemic
    glyph: ○?
    pattern: open.hatch
  binds:
  - enum: ObservationStatus
    values:
    - UNKNOWN
  views:
  - 2
  - 3
  - 4
  primitive: SpaceCell
  term: obs.unknown
  exclusion: never red; never FALSE or NOT_APPLICABLE
- id: SEM-007
  name: Not determined
  channels:
    shape: octagon open slash
    color: open.epistemic
    glyph: ○/
    pattern: open.hatch
  binds:
  - enum: ReconstructionStatus
    values:
    - UNDETERMINED
  - enum: AssessmentStatus
    values:
    - UNDETERMINED
  views:
  - 2
  - 3
  - 5
  - 6
  - 9
  primitive: SpaceCell
  term: rec.undetermined
  exclusion: never UNKNOWN or FALSE
- id: SEM-008
  name: Not applicable
  channels:
    shape: rect dotted empty
    color: open.absent
    glyph: N/A
    pattern: null
  binds:
  - enum: Applicability
    values:
    - NOT_APPLICABLE
  - enum: ObservationStatus
    values:
    - NOT_APPLICABLE
  - enum: ReconstructionStatus
    values:
    - NOT_APPLICABLE
  views:
  - 2
  - 3
  - 4
  primitive: SpaceCell
  term: app.na
  exclusion: not counted as gap or error
- id: SEM-009
  name: No reconstruction at tick
  channels:
    shape: gap dotted
    color: open.absent
    glyph: —@t
    pattern: null
  binds:
  - enum: ContentAvailability
    values:
    - NOT_AVAILABLE_AT_TICK
  views:
  - 3
  - 5
  - 6
  - 7
  - 8
  primitive: SpaceCell
  term: avail.none
  exclusion: not VIEW_DATA_UNAVAILABLE
- id: SEM-010
  name: Satisfied
  channels:
    shape: diamond
    color: eval.coherent
    glyph: ◆1
    pattern: null
  binds:
