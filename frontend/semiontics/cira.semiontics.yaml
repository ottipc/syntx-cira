# SSOT of the visual and semiontic identity (G04.1). Hand-maintained. Generated outputs: tools/gen_semiontics.py
version: 1.1.0
source: Package v1.0.2 G03.12, G03.13; GREF SEM-001–030
tokens:
  color:
    surface.void: '#05080B'
    surface.field: '#090D11'
    surface.panel: '#0F161D'
    surface.elevated: '#16202A'
    border.hairline: '#1C2833'
    border.strong: '#33475A'
    ink.primary: '#E6EDF5'
    ink.secondary: '#9AA8B8'
    ink.muted: '#8391A3'
    space.actual: '#38BDF8'
    space.observed: '#F59E0B'
    space.reconstructed: '#A78BFA'
    space.actual.tint: '#0D2533'
    space.observed.tint: '#2C200B'
    space.reconstructed.tint: '#211A36'
    eval.coherent: '#2DD4BF'
    eval.violation: '#F43F5E'
    eval.partial: '#A3E635'
    brand.core: '#BFEFF4'
  alias:
    open.epistemic: ink.secondary
    open.absent: ink.muted
  contrast_rules:
    text_surfaces:
    - surface.field
    - surface.panel
    - surface.elevated
    text_tokens:
    - ink.primary
    - ink.secondary
    - ink.muted
    - space.actual
    - space.observed
    - space.reconstructed
    - eval.coherent
    - eval.partial
    text_tokens_field_panel:
    - eval.violation
    tint_text:
    - ink.primary
    - ink.secondary
    tints:
    - space.actual.tint
    - space.observed.tint
    - space.reconstructed.tint
    graphic_min: 3.0
    text_min: 4.5
    semantic_pairs_delta_e_min: 15
    decorative:
    - brand.core
    decorative_delta_e_min: 15
    network_surface: surface.field
    network_max_opacity: network.max
    semantic:
    - space.actual
    - space.observed
    - space.reconstructed
    - eval.coherent
    - eval.violation
    - eval.partial
  type:
    display:
      size: 18
      line: 24
      weight: 600
      family: sans
    section:
      size: 13
      line: 18
      weight: 600
      family: sans
      caps: true
      tracking: 0.06em
    body:
      size: 13
      line: 19
      weight: 400
      family: sans
    mono.value:
      size: 13
      line: 18
      weight: 500
      family: mono
      tabular: true
    mono.id:
      size: 11
      line: 16
      weight: 400
      family: mono
      tabular: true
    mono.operator:
      size: 14
      line: 18
      weight: 500
      family: mono
    micro:
      size: 10
      line: 14
      weight: 600
      family: sans
      caps: true
      tracking: 0.08em
  family:
    sans: IBM Plex Sans
    mono: DejaVu Mono
  presentation_scale: 1.25
  space:
    unit: 4
    grid:
    - 4
    - 8
    - 12
    - 16
    - 24
    - 32
  border:
    width.base: 1
    width.emphasis: 2
  radius:
    actual: 0
    observed: 0
    observed.chamfer: 6
    reconstructed: 2
  pattern:
    open.hatch:
      angle: 45
      size: 6
      opacity: 0.12
    fixture.stripe:
      angle: 45
      size: 4
      opacity: 0.3
    outside.crosshatch:
      size: 6
      opacity: 0.1
  line:
    topology.depends_on: solid 1.5 ink.secondary triangle
    topology.reports_to: dash 6/3 ink.secondary open-angle
    topology.provides: solid 1.5 ink.secondary source-dot
    coupling.effective: solid 2 space.reconstructed
    coupling.possible: dash 5/4 eval.partial
    coupling.unknown: dot 2/4 ink.secondary open-circle
    barrier: double 2 eval.violation
    recovery: double 1.5 ink.secondary diamond
  motion:
    tick: 180
    loading: 100
    quarantine: 0
    drawer: 160
    stage: 200
    network.pulse: 9000
    hover: 80
    focus: 120
    scrub: 140
    carry: 160
    brand.breath: 14000
    ambient.drift: 36000
    decor.yield: 480
  graph:
    node.char_width: 7.8
    node.slot_chars: 12
    node.padding: 12
    node.min_width: 160
    node.height: 64
    layer_gap: 72
    node_gap: 32
  z:
    canvas: 10
    chrome: 20
    drawer: 30
    quarantine: 40
    demo: 50
  zone:
    a.height: 48
    b.width: 220
    b.collapsed: 56
    c.min_width: 760
    d.height: 52
    e.width: 360
    e.dock_from: 1600
    min_viewport_w: 1280
    min_viewport_h: 720
  opacity:
    loading: 0.35
    network.line: 0.06
    network.max: 0.08
    glow: 0.45
  # ---- v1.1.0: neurovisual GUI generation (architecture v2.0.3, ADR-0008) ----------------------------------------
  # Derived colours are formulas; the generator resolves them before any check (05.1 T1). Never type their values.
  derive:
    surface.focus: {op: lightest_on_path, from: surface.panel, to: surface.elevated, keep: {eval.violation: 4.6}}
    attn.tint.actual: {op: mix, a: space.actual.tint, b: surface.field, t: 0.5}
    attn.tint.observed: {op: mix, a: space.observed.tint, b: surface.field, t: 0.5}
    attn.tint.reconstructed: {op: mix, a: space.reconstructed.tint, b: surface.field, t: 0.5}
    attn.border.hairline: {op: mix, a: border.hairline, b: surface.field, t: 0.55}
  # Enhanced Projector Contrast profile (05.15): overrides under html[data-profile="projector"]
  profile_projector:
    surface.void: '#000000'
    surface.field: '#04070A'
    surface.panel: '#111A22'
    border.hairline: '#2A3A4B'
    border.strong: '#546D86'
    attn.tint.actual: '#08161E'
    attn.tint.observed: '#18140A'
    attn.tint.reconstructed: '#121020'
    pattern.open.hatch.opacity: 0.18
    pattern.outside.crosshatch.opacity: 0.16
  component:
    focus.reticle.size: 6
    focus.reticle.gap: 4
    focus.border.width: 2
    resonance.width: 1.5
    resonance.offset: 3
    relation.linked.extra: 0.5
    attention.axis.focused: 2
    attention.axis.resonant: 1
    attention.axis.gutter: 8
    bar.track.height: 4
    bar.track.max: 256
    metric.hero.size: 28
    metric.hero.line: 36
  decor:
    alpha.text: 0.11
    alpha.reserve: 0.20
    alpha.damped: 0.14
    axis.alpha: 0.06
    light.alpha: 0.05
    light.radius: 1.25
    light.damped: 0.6
    occupancy.pad: 14
    drift.px: 8
    vignette.alpha: 0.40
    vignette.clear: 0.28
  comp:
    reserve: 0.32
    ring.k: 0.40
    ring.h: 0.30
    anchor.cy: 0.50
    ring.min: 84
    ring.max: 320
    min.info: 880
    stage.short: 880
    gutter: 24
  light:
    shadow.length: 8
    shadow.bias: 4
    shadow.blur: 24
    shadow.spread: -6
    shadow.alpha: 0.55
  presentation_ref_height: 1080
  # decor budgets checked against every text token allowed on decor ground (eval.violation is excluded by lint, G3-31)
  decor_rules:
    ground: surface.field
    text_on_decor: [ink.primary, ink.secondary, ink.muted, space.actual, space.observed, space.reconstructed, eval.coherent, eval.partial]
    excluded_from_decor_ground: [eval.violation]
    graphic_inks: [ink.primary, ink.secondary]
    projector_edge_min: 3.0
  # animated colour pairs (05.11): [foreground from, foreground to, ground from, ground to]; the generator proves the path minimum
  transitions:
    attenuate.primary: [ink.primary, ink.secondary, surface.panel, surface.field]
    attenuate.secondary: [ink.secondary, ink.muted, surface.panel, surface.field]
    attenuate.muted: [ink.muted, ink.muted, surface.panel, surface.field]
    attenuate.violation: [eval.violation, eval.violation, surface.panel, surface.field]
    attenuate.tint.actual: [ink.muted, ink.muted, space.actual.tint, attn.tint.actual]
    attenuate.tint.secondary: [ink.secondary, ink.muted, space.actual.tint, attn.tint.actual]
    focus.violation: [eval.violation, eval.violation, surface.panel, surface.focus]
    focus.muted: [ink.muted, ink.muted, surface.panel, surface.focus]
decorative:
- id: DEC-01
  name: brand mark
  where: zone A, favicon
  form: emblem image (circle with antlers) in brand.core glow
  meaning: none — identity of the workspace only; never a state, value or rule
- id: DEC-02
  name: neural field
  where: zone C background, behind all blocks
  form: fixed node mesh in brand.core at ≤ opacity network.max, slow pulse (none under reduced motion)
  meaning: none — never encodes data; generated from a fixed seed, independent of any projection
- id: DEC-03
  name: chain connector
  where: view 01 layer chain
  form: brand.core line with glow between consecutive fields
  meaning: only the fixed order F01 → F07; couplings and the barrier keep their own signs (SEM-019, SEM-037)
