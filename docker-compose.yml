# CIRA runtime chain (15.10 step 4, AK-10): docker compose up --build --wait  →  tools/smoke.sh
# Without a reachable Docker daemon AK-10 is recorded as "DEP-07a / EXTERN_AUSZUFÜHREN" (never simulated).
services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["cira-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request;assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['status']=='ok'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["127.0.0.1:4173:4173"]
    environment: { CIRA_API: "http://127.0.0.1:8000" }
    depends_on: { backend: { condition: service_healthy } }
volumes:
  cira-data: {}
